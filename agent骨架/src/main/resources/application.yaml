server:
  port: 8081

spring:
  application:
    name: agent-service
  profiles:
    active: dev
  cloud:
    # ---------- OpenFeign 超时（2026-10-23 修复） ----------
    # 原配置完全没有 openfeign 超时项，走的是默认 connect 10s / read 60s。
    # 老项目一旦卡顿，8081 的 16 个 Agent 线程会被逐个占满，表现为「对话一直转圈」。
    # 这里收紧到 2s/5s，让调用快速失败，由编排层给出确定性降级话术。
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic
    nacos:
      # ---------- 注册中心 ----------
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: public
        group: DEFAULT_GROUP
      # ---------- 配置中心 ----------
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml
        group: DEFAULT_GROUP
        # 支持不重启刷新：改 Nacos 里的配置，@RefreshScope 的 Bean 立刻生效
        refresh-enabled: true

  # ---------- Agent 自己的库（与老项目 db_tear 分开） ----------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/db_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:123456}   # 本机 MySQL 实际密码；生产用环境变量覆盖

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 2          # 老项目用 1，Agent 用 2，互不污染
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    # 【2026-10-23 修复】MQ 未部署时不要把服务拖进「每 5 秒重连」的死循环。
    # 原配置的 listener.simple.retry 只作用于「消息处理重试」，不约束「连接恢复」，
    # 所以 Broker 没起时 SimpleMessageListenerContainer 会永久重连：
    # 实测日志以约 1.5MB/小时增长，/actuator/health 直接被 rabbit 组件打成 DOWN。
    # 本机演示没有 RabbitMQ，默认关闭监听；要启用时设 MQ_ENABLED=true 并配 profile。
    connection-timeout: 3s
    listener:
      simple:
        auto-startup: ${MQ_ENABLED:false}
        acknowledge-mode: manual      # 手动 ack，配合幂等消费
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0

mybatis-plus:
  type-aliases-package: com.guchen.agent.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isvalid
      logic-delete-value: "N"
      logic-not-delete-value: "Y"

# ---------- LLM 配置（可被 Nacos 覆盖，实现模型热切换） ----------
llm:
  # 三者均由系统环境变量注入，密钥不入库、不进 git 历史
  # LLM_BASE_URL 指向自建网关（OpenAI 兼容协议）；换平台只改环境变量，代码零改动
  base-url: ${LLM_BASE_URL:https://api1.dshapi.icu/v1}
  api-key: ${LLM_API_KEY:sk-REPLACE_ME}
  chat-model: ${LLM_CHAT_MODEL:deepseek-v4.1-flash}
  # ---------- embedding（RAG 向量腿）：硅基流动 BAAI/bge-m3，2026-10-07 接通 ----------
  embedding-base-url: ${EMBED_BASE_URL:https://api.siliconflow.cn}
  embedding-api-key: ${EMBED_API_KEY:}              # Key 走系统环境变量，不入库
  embedding-model: ${EMBED_MODEL:BAAI/bge-m3}
  timeout-seconds: 60
  max-retries: 3
  retry-backoff-ms: 800

# ---------- Agent 运行参数（Nacos 动态改，不重启） ----------
agent:
  max-iterations: 6
  max-tool-calls-per-turn: 8
  tool-timeout-ms: 3000
  memory:
    max-turns: 10
    ttl-minutes: 120

# ---------- 向量库 ----------
vector:
  qdrant:
    host: 127.0.0.1
    port: 6334
    collection: ms_tea_knowledge
    enabled: true
  milvus:
    host: 127.0.0.1
    port: 19530
    collection: ms_tea_knowledge
    enabled: false        # 做对比实验时才置 true

# ---------- 被调用的老项目 ----------
services:
  tear-spring:
    service-name: tearSpring
    # 直连地址。填写后绕开 Nacos 服务发现，不受本机 IP 变化影响。
    # 本地开发建议保持 127.0.0.1:8080；生产多实例部署时清空，改用服务发现。
    url: ${TEAR_SPRING_URL:http://127.0.0.1:8080}

# ---------- MCP / A2A ----------
mcp:
  enabled: true
  server-name: mansicha-tea-tools
  endpoint-path: /mcp
a2a:
  enabled: true
  agent-card-path: /.well-known/agent.json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # 【2026-10-23 修复】always 会把 DB 类型、磁盘绝对路径等细节匿名暴露给公网
      show-details: when-authorized
  health:
    rabbit:
      # MQ 未部署时不参与整体健康判定，否则健康检查永远 DOWN，接探针就是重启循环
      enabled: ${MQ_ENABLED:false}

logging:
  level:
    # 【2026-10-23 修复】DEBUG 会把工具入参（含手机号、地址）整段打进日志
    com.guchen.agent: INFO
    org.springframework.web: INFO

# ---------- 运营后台鉴权 ----------
# 不配置 admin.password 时后台不鉴权（本地开发便利）。
# 部署到公网前必须配置，否则任何人都能改订单与商品数据。
# 配置方式：setx ADMIN_PASSWORD "your-password"  然后重启服务
admin:
  # 多账号：格式 用户名:口令:角色，逗号分隔。角色只有 admin（读写）/ viewer（只读）。
  # 示例：ADMIN_USERS=admin:pass123:admin,viewer:look456:viewer
  users: ${ADMIN_USERS:}
  # 单口令兼容模式（仅当 users 为空时生效），视为 admin 账号
  password: ${ADMIN_PASSWORD:}
  token-ttl-hours: 8
